<html lang="en">
<head>

  <title>Formulario</title>
</head>
<body>
  <h1>Formulario</h1>
  <form action="" method="post">
    <p><label for="nombre"> Nombre: <input type="text" id="nombre"></label></p>
    <p><label for="apellido"> Apellido: <input type="text" id="apellido"></label></p>
    <p><label for="edad"> Edad: <input type="text" id="edad"></label></p>
    <p><label for="asunto"> Asunto: <textarea id="asunto"></textarea></label></p>
    <p><label> Horario: 
      <select id="Horario">
        <option value="manana" disabled> Mañana </option>
        <option value="tarde"> Tarde </option>
        <option value="noche" selected> Noche </option>
      </select>
    </label></p>
