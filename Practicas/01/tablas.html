<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablas</title>
</head>
<style>
  table, th, td {
    border: 1px solid black;
    border-collapse: collapse;
  }
</style>
<body>
  <table style="width: 100%;">
    <tr>
      <th>Nombre</th>
      <th>Ciudad</th>
      <th>Pais</th>
    </tr>

    <tr>
      <td>Carlos Robles</td>
      <td>Valencia</td>
      <td>España</td>
    </tr>
    
    <tr>
      <td>Ana Perez</td>
      <td>Buenos</td>
      <td>Argentina</td>
    </tr>
    
    <tr>
      <td>Sofia Gomez</td>
      <td>Bogota</td>
      <td>Colombia</td>
    </tr>
  </table>

  <br><br>

  <table style="width: 100%;">
    <tr>
      <th>Nombre</th>
      <th>Ciudad</th>
      <th>Pais</th>
    </tr>

    <tr>
      <td>Carlos Robles</td>
      <td colspan="2">Valencia - España</td>
    </tr>
    
    <tr>
      <td  rowspan="2">Ana Perez <br>Sofia Gomez</td>
      <td>Buenos</td>
      <td>Argentina</td>
    </tr>
    
    <tr>
      <td>Bogota</td>
      <td>Colombia</td>
    </tr>
  </table>
</body>
</html>
