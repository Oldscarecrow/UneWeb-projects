<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <title>Proyecto</title>
</head>
<body>
  <div class="banner">
    <img src="./Imagenes/Banner.png" alt="Cabecera" width="1000px" height="180px">
  </div>

  <div class="nav">
    <a href="./index.html" class="nav-link">Inicio</a>
    <a href="./mision.html" class="nav-link">Misión y Visión</a>
    <a href="./eventos.html" class="nav-link">Eventos</a>
    <a href="./galeria.html" class="nav-link"class="nav-link">Galería</a>
    <a href="./inscripcion.html" class="nav-link">Inscríbeme</a>
  </div>

  <div class="content">
    <table>
      
      <tr>
        <td colspan="2" class="table-head">
          <h1>Inscríbete al Club</h1>
        </td>
      </tr>

      <tr>
        <td class="table-img-container">
          <img src="./Imagenes/imagen-inscripcion.jpg" alt="Imagen" class="table-img">
        </td>

        <td class="table-content-container"
          <form action="" method="post">
            <p><label for="nombre"> Nombres: <input type="text" id="nombre"></label></p>
            <p><label for="apellido"> Apellidos: <input type="text" id="apellido"></label></p>
            <p><label for="edad"> Edad: <input type="text" id="edad"></label></p>
            <p><label for="correo"> Correo Electronico: <input type="text" id="correo"></label></p>

            <p><label for="mascota">
              Mascota:
              <select id="tipocorreo">
                <option value="conejo"> Conejo </option>
                <option value="gato"> Gato </option>
                <option value="iguana"> Iguana </option>
                <option value="perico"> Perico </option>
                <option value="pez"> Pez </option>
                <option value="perro"> Perro </option>
                <option value="serpiente"> Serpiente </option>
                <option value="tortuga"> Tortuga </option>
              </select>
            </label></p>

            <p><label for="nombre_mascota"> Nombre de tu mascota: <input type="text" id="nombre_mascota"></label></p>
            <p><label for="edad_mascota"> Edad de tu mascota: <input type="text" id="edad_mascota"></label></p>
            <p><label for="motivo">¿Porque decidiste unirte al club?<br> <textarea id="motivo"></textarea></label></p>

            <button type="submit"> Enviar</button>
          </form>
        </td>
      </tr>

    </table>
  </div>

  <div class="foot">
    <h3>Pagina creada por: <a href="https://github.com/Oldscarecrow" target="_blank">Herbert Rujana</a></h3>
  </div>

  
</body>


</html>
