<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto</title>
</head>
<body>
  <div style="width: 1000px; height: 180px; background-color: yellow; margin: 0 auto; display: flex; justify-content: center; align-items: center;">
    <img src="./Imagenes/Banner.png" alt="Cabecera" width="1000px" height="180px">
  </div>

  <div style="width: 1000px; height: 50px; background-color: rgb(230,216,145); margin: 0 auto; display: flex; justify-content: center; align-items: center;">
    <a href="./index.html" style="font-family: 'Ink Free'; font-size: 18px; color: black; margin: 0 10px;">Inicio</a>
    <a href="./mision.html" style="font-family: 'Ink Free'; font-size: 18px; color: black; margin: 0 10px;">Misión y Visión</a>
    <a href="./eventos.html" style="font-family: 'Ink Free'; font-size: 18px; color: black; margin: 0 10px;">Eventos</a>
    <a href="./galeria.html" style="font-family: 'Ink Free'; font-size: 18px; color: black; margin: 0 10px;">Galería</a>
    <a href="./inscripcion.html" style="font-family: 'Ink Free'; font-size: 18px; color: black; margin: 0 10px;">Inscríbeme</a>
  </div>

  <div style="width: 1000px; height: 550px; background-color: rgb(238,238,238); margin: 0 auto; display: flex; justify-content: center; align-items: center;">
    <table style="width: 800px; height: 400px;">
      
      <tr>
        <td colspan="2" style="text-align: center;">
          <h1>Inscríbete al Club</h1>
        </td>
      </tr>

      <tr>
        <td style="width: 400px; vertical-align: top;">
          <img src="./Imagenes/imagen-inscripcion.jpg" alt="Imagen" style="width: 400px; height: 400px;">
        </td>

        <td style="padding-top: 40px; padding-left: 40px; vertical-align: top;">
          <form action="" method="post">
            <p><label for="nombre"> Nombres: <input type="text" id="nombre"></label></p>
            <p><label for="apellido"> Apellidos: <input type="text" id="apellido"></label></p>
            <p><label for="edad"> Edad: <input type="text" id="edad"></label></p>
            <p><label for="correo"> Correo Electronico: <input type="text" id="correo"></label></p>

            <p><label for="mascota">
              Mascota:
              <select id="tipocorreo">
                <option value="conejo"> Conejo </option>
                <option value="gato"> Gato </option>
                <option value="iguana"> Iguana </option>
                <option value="perico"> Perico </option>
                <option value="pez"> Pez </option>
                <option value="perro"> Perro </option>
                <option value="serpiente"> Serpiente </option>
                <option value="tortuga"> Tortuga </option>
              </select>
            </label></p>

            <p><label for="nombre_mascota"> Nombre de tu mascota: <input type="text" id="nombre_mascota"></label></p>
            <p><label for="edad_mascota"> Edad de tu mascota: <input type="text" id="edad_mascota"></label></p>
            <p><label for="motivo">¿Porque decidiste unirte al club?<br> <textarea id="motivo"></textarea></label></p>

            <button type="submit"> Enviar</button>
          </form>
        </td>
      </tr>

    </table>
  </div>

  <div style="width: 1000px; height: 70px; background-color: rgb(140,204,226); margin: 0 auto; display: flex; justify-content: center; align-items: center;">
    <h3 style="text-align: center;">Pagina creada por: <a href="https://github.com/Oldscarecrow" target="_blank">Herbert Rujana</a></h3>
  </div>

  
</body>


</html>
